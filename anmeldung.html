<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anmeldung - Spielgruppe Rägiräupli</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-i18n-title="anmeldung_title_page">

<header>
  <a href="index.html" class="logo"><img src="Logo.png" alt="Spielgruppe Rägiräupli" class="logo-img"><span data-i18n="brand_name"></span></a>
  <button class="nav-toggle" onclick="toggleNav()" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <nav id="site-nav">
    <ul>
      <li><a href="leitbild.html" data-i18n="nav_leitbild"></a></li>
      <li><a href="konzept.html" data-i18n="nav_konzept"></a></li>
      <li><a href="team.html" data-i18n="nav_team"></a></li>
      <li><a href="tarife.html" data-i18n="nav_tarife"></a></li>
      <li><a href="anmeldung.html" class="current" data-i18n="nav_anmeldung"></a></li>
      <li><a href="kontakt.html" data-i18n="nav_kontakt"></a></li>
    </ul>
  </nav>
  <div class="header-actions">
    <div class="lang-switch">
      <select id="lang-select" onchange="setLang(this.value)">
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="en">English</option>
        <option value="it">Italiano</option>
        <option value="pt">Português</option>
        <option value="es">Español</option>
        <option value="sq">Shqip</option>
        <option value="tr">Türkçe</option>
        <option value="sh">Bosanski / Hrvatski / Srpski</option>
      </select>
    </div>
  </div>
</header>

<div class="page-header">
  <h1 data-i18n="anmeldung_title"></h1>
</div>

<main>
  <section>
    <p style="margin-bottom:1.2rem;max-width:520px;" data-i18n="anmeldung_intro"></p>
    <form id="anmeldung-form" novalidate>
      <div>
        <label data-i18n="anmeldung_child_name"></label>
        <input type="text" id="child-name" data-validate="letters" required>
        <div class="field-error" data-i18n="anmeldung_letters_error"></div>
      </div>
      <div>
        <label data-i18n="anmeldung_birthdate"></label>
        <input type="date" id="birthdate" required>
        <div class="field-error" data-i18n="anmeldung_birthdate_error"></div>
      </div>
      <div class="autocomplete-wrap">
        <label data-i18n="anmeldung_nationality"></label>
        <input type="text" id="nationality" autocomplete="off" required>
        <div class="autocomplete-list" id="nationality-suggestions"></div>
      </div>
      <div>
        <label data-i18n="anmeldung_mother_tongue"></label>
        <input type="text" id="mother-tongue" data-validate="letters" required>
        <div class="field-error" data-i18n="anmeldung_letters_error"></div>
      </div>
      <div>
        <label data-i18n="anmeldung_allergies"></label>
        <input type="text" id="allergies" data-validate="letters-optional">
        <div class="field-error" data-i18n="anmeldung_letters_error"></div>
      </div>
      <div>
        <label data-i18n="anmeldung_health_info"></label>
        <textarea rows="2" id="health-info" data-validate="text-optional"></textarea>
        <div class="field-error" data-i18n="anmeldung_letters_error"></div>
      </div>
      <div>
        <label data-i18n="anmeldung_siblings"></label>
        <input type="text" id="siblings">
      </div>
      <div>
        <label data-i18n="anmeldung_parent_name"></label>
        <input type="text" id="parent-name" data-validate="letters" required>
        <div class="field-error" data-i18n="anmeldung_letters_error"></div>
      </div>
      <div class="autocomplete-wrap">
        <label data-i18n="anmeldung_street"></label>
        <input type="text" id="street" autocomplete="off" required>
        <div class="autocomplete-list" id="street-suggestions"></div>
        <div class="field-hint" data-i18n="anmeldung_street_hint"></div>
      </div>
      <div>
        <label data-i18n="anmeldung_plz_ort"></label>
        <input type="text" id="plz-ort" required>
      </div>
      <div>
        <label data-i18n="anmeldung_who_brings"></label>
        <div class="radio-group">
          <label><input type="radio" name="who-brings" value="vater" required><span data-i18n="anmeldung_who_vater"></span></label>
          <label><input type="radio" name="who-brings" value="mutter"><span data-i18n="anmeldung_who_mutter"></span></label>
          <label><input type="radio" name="who-brings" value="andere"><span data-i18n="anmeldung_who_andere"></span></label>
        </div>
        <input type="text" id="who-brings-other" style="display:none;margin-top:.5rem;" data-i18n-placeholder="anmeldung_who_other_ph">
        <div class="field-error" data-i18n="anmeldung_letters_error"></div>
      </div>
      <div>
        <label>E-Mail</label>
        <input type="email" id="email" required>
        <div class="field-error" data-i18n="anmeldung_email_error"></div>
      </div>
      <div>
        <label data-i18n="anmeldung_phone"></label>
        <input type="tel" id="phone" required>
        <div class="field-error" data-i18n="anmeldung_phone_error"></div>
      </div>
      <div>
        <label data-i18n="anmeldung_phone_mother"></label>
        <input type="tel" id="phone-mother">
        <div class="field-error" data-i18n="anmeldung_phone_error"></div>
      </div>
      <div>
        <label data-i18n="anmeldung_phone_father"></label>
        <input type="tel" id="phone-father">
        <div class="field-error" data-i18n="anmeldung_phone_error"></div>
      </div>
      <div>
        <label data-i18n="anmeldung_frequency"></label>
        <select>
          <option data-i18n="anmeldung_freq_1"></option>
          <option data-i18n="anmeldung_freq_2"></option>
          <option data-i18n="anmeldung_freq_3"></option>
          <option data-i18n="anmeldung_freq_4"></option>
        </select>
      </div>
      <div>
        <label data-i18n="anmeldung_days_label"></label>
        <div class="weekday-check">
          <label><input type="checkbox"> <span data-i18n="anmeldung_day_di"></span></label>
          <label><input type="checkbox"> <span data-i18n="anmeldung_day_mi"></span></label>
          <label><input type="checkbox"> <span data-i18n="anmeldung_day_do"></span></label>
          <label><input type="checkbox"> <span data-i18n="anmeldung_day_fr"></span></label>
        </div>
      </div>
      <label class="consent">
        <input type="checkbox" required>
        <span data-i18n-html="anmeldung_consent_html"></span>
      </label>
      <button type="submit"><span data-i18n="anmeldung_submit"></span></button>
    </form>
  </section>
</main>

<footer>
  <div class="footer-grid">
    <div>
      <h3 data-i18n="brand_name"></h3>
      <p data-i18n="footer_address"></p>
    </div>
    <div>
      <h3 data-i18n="footer_legal"></h3>
      <p><a href="impressum.html" data-i18n="footer_impressum"></a></p>
      <p><a href="datenschutz.html" data-i18n="footer_datenschutz"></a></p>
      <p><a href="vertragsbedingungen.html" data-i18n="footer_vertrag"></a></p>
    </div>
    <div>
      <h3 data-i18n="footer_kontakt"></h3>
      <p><span data-i18n="footer_telefon"></span>: 076 249 36 36<br>alessia.spielgruppe@outlook.com</p>
      <div class="social-icons">
        <a class="social-icon" href="https://www.facebook.com/elternclubRegensdorf/?locale=de_DE" target="_blank" rel="noopener" aria-label="Facebook">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M22 12.06C22 6.51 17.52 2 12 2S2 6.51 2 12.06C2 17.06 5.66 21.2 10.44 22v-7.03H7.9v-2.91h2.54V9.85c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.78-1.63 1.58v1.9h2.78l-.45 2.91h-2.33V22C18.34 21.2 22 17.06 22 12.06"/></svg>
        </a>
      </div>
    </div>
  </div>
  <div class="copyright">© 2026 <span data-i18n="brand_name"></span> · <span data-i18n="footer_rechte"></span></div>
</footer>

</body>
</html>
